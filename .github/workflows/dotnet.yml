name: .NET Build and Test

on:
  workflow_call:

env:
  KUI_SOLUTION: HttpPostExperiment.sln
  KUI_SOLUTION_BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      name: Development
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dotnet Clean
        run: dotnet clean ${{ env.KUI_SOLUTION }}

      - name: Dotnet Restore
        run: dotnet restore ${{ env.KUI_SOLUTION }}

      - name: Dotnet Build
        run: dotnet build ${{ env.KUI_SOLUTION }} -c ${{ env.KUI_SOLUTION_BUILD_CONFIGURATION }} --no-restore

      - name: Run Tests with Coverage and TRX
        run: |
          dotnet test ${{ env.KUI_SOLUTION }} -c ${{ env.KUI_SOLUTION_BUILD_CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./coverage

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: coverage/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: markdown
          thresholds: '50 75'

      - name: Append Coverage to Workflow Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('code-coverage-results.md', 'utf8');
            await core.summary.addRaw(summary).write();

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

