name: .NET Build and Test

on:
  workflow_call:

env:
  KUI_SOLUTION: HttpPostExperiment.sln
  KUI_SOLUTION_BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      name: Development
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dotnet Clean
        run: dotnet clean ${{ env.KUI_SOLUTION }}

      - name: Dotnet Restore
        run: dotnet restore ${{ env.KUI_SOLUTION }}

      - name: Dotnet Build
        run: dotnet build ${{ env.KUI_SOLUTION }} -c ${{ env.KUI_SOLUTION_BUILD_CONFIGURATION }} --no-restore

      - name: Run Tests with Coverage
        run: dotnet test ${{ env.KUI_SOLUTION }} -c ${{ env.KUI_SOLUTION_BUILD_CONFIGURATION }} --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage --DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[HttpTriggerPostNewExperimentTests]*"
        # run: dotnet test ${{ env.KUI_SOLUTION }} -c ${{ env.KUI_SOLUTION_BUILD_CONFIGURATION }} --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./coverage

      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/**/coverage.cobertura.xml
          badge: true
          format: markdown
          output: both
          fail_below_min: false
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          thresholds: '50 75'
 
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
 
      - name: Write coverage to Job Summary
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
 